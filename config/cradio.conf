# 1. Usar el oscilador RC interno en vez del cristal externo (arregla el fallo de BLE en clones SuperMini)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# 2. Subir la potencia de la antena BLE al máximo (+8 dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 3. Forzar compatibilidad de pila BLE entre mitades
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y